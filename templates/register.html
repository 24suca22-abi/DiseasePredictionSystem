{% extends "base.html" %}

{% block title %}Register - Care Nova{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-badge">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <line x1="19" x2="19" y1="8" y2="14"/>
                    <line x1="22" x2="16" y1="11" y2="11"/>
                </svg>
            </div>
            <h1 class="card-title">Create Account</h1>
            <p class="card-subtitle">Join Care Nova to begin your AI health assessments</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label class="form-label" for="fullname">Full Name</label>
                <div class="input-with-icon">
                    <span class="field-icon">📝</span>
                    <input 
                        type="text" 
                        id="fullname" 
                        name="fullname" 
                        class="form-control" 
                        placeholder="e.g. John Doe"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <div class="input-with-icon">
                    <span class="field-icon">👤</span>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="e.g. johndoe"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-with-icon">
                    <span class="field-icon">✉️</span>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="e.g. john@example.com"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-with-icon">
                    <span class="field-icon">🔒</span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Create a strong password"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 12px;">
                Create Care Nova Account
            </button>
        </form>

        <div class="auth-footer">
            <p class="auth-footer-text">Already have a Care Nova account?</p>
            <a href="{{ url_for('login') }}" class="btn btn-secondary btn-block" style="margin-top: 10px;">
                Sign In to Existing Account
            </a>
        </div>
    </div>
</div>
{% endblock %}
